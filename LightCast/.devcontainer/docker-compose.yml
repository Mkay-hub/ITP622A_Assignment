version: '3.8'

services:
  # The PHP container — this runs your website
  php:
    build:
      context: .              # Use the Dockerfile in this folder
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached  # Mount your project files
    ports:
      - "8000:8000"           # Makes your site available on port 8000
    depends_on:
      - db                    # Wait for MySQL to start before PHP runs

  # The MySQL database container
  db:
    image: mysql:8.0          # Use official MySQL version 8 image
    restart: always           # Automatically restart if it stops
    environment:
      MYSQL_ROOT_PASSWORD: root           # Root user password (for development only)
      MYSQL_DATABASE: lightcast_db        # Database name to create
      MYSQL_USER: lightcast_user          # Regular user
      MYSQL_PASSWORD: lightcast_pass      # Password for that user
    ports:
      - "3306:3306"           # Expose MySQL port so PHP can connect
    volumes:
      # This line automatically loads your SQL schema file when the DB starts
      - ./../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
